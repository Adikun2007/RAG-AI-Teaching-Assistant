<svg width="680" viewBox="0 0 680 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Video Course RAG Assistant – Pipeline</title>
  <desc>End-to-end pipeline: MP4 videos → FFmpeg audio → Whisper transcription → chunk merging → bge-m3 embeddings → Groq LLM → timestamped answer.</desc>

  <defs>
    <!-- Arrow markers per colour -->
    <marker id="arr-gray"   viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-teal"   viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-amber"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-coral"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr-blue"   viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- ── GLOBAL FONT ── -->
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .lbl  { font-size:11px; fill:#888780; letter-spacing:.05em; font-weight:600; }
    .div  { stroke:#D3D1C7; stroke-width:.5; }

    /* folder / data nodes */
    .folder rect  { fill:#F1EFE8; stroke:#888780; stroke-width:.5; }
    .folder text  { fill:#2C2C2A; }

    /* teal – audio extraction */
    .teal rect  { fill:#E1F5EE; stroke:#0F6E56; stroke-width:.5; }
    .teal .head { fill:#085041; font-weight:600; }
    .teal .sub  { fill:#0F6E56; }
    .teal-pill  { fill:#9FE1CB; }
    .teal-pill-t{ fill:#085041; }

    /* purple – transcription */
    .purple rect  { fill:#EEEDFE; stroke:#534AB7; stroke-width:.5; }
    .purple .head { fill:#26215C; font-weight:600; }
    .purple .sub  { fill:#534AB7; }
    .purple-pill  { fill:#AFA9EC; }
    .purple-pill-t{ fill:#26215C; }

    /* amber – chunking */
    .amber rect  { fill:#FAEEDA; stroke:#854F0B; stroke-width:.5; }
    .amber .head { fill:#412402; font-weight:600; }
    .amber .sub  { fill:#854F0B; }
    .amber-pill  { fill:#FAC775; }
    .amber-pill-t{ fill:#412402; }

    /* coral – embeddings */
    .coral rect  { fill:#FAECE7; stroke:#993C1D; stroke-width:.5; }
    .coral .head { fill:#4A1B0C; font-weight:600; }
    .coral .sub  { fill:#993C1D; }
    .coral-pill  { fill:#F0997B; }
    .coral-pill-t{ fill:#4A1B0C; }

    /* blue – retrieval / answer */
    .blue rect  { fill:#E6F1FB; stroke:#185FA5; stroke-width:.5; }
    .blue .head { fill:#042C53; font-weight:600; }
    .blue .sub  { fill:#185FA5; }
    .blue-pill  { fill:#85B7EB; }
    .blue-pill-t{ fill:#042C53; }

    /* output – green pill */
    .green-pill  { fill:#C0DD97; }
    .green-pill-t{ fill:#173404; }

    /* connector lines */
    .conn-gray   { stroke:#888780; stroke-width:1.5; fill:none; }
    .conn-teal   { stroke:#1D9E75; stroke-width:1.5; fill:none; }
    .conn-purple { stroke:#7F77DD; stroke-width:1.5; fill:none; }
    .conn-amber  { stroke:#BA7517; stroke-width:1.5; fill:none; }
    .conn-coral  { stroke:#D85A30; stroke-width:1.5; fill:none; }
    .conn-blue   { stroke:#378ADD; stroke-width:1.5; fill:none; }

    /* query side-entry */
    .q-bubble rect { fill:#EEEDFE; stroke:#534AB7; stroke-width:.5; }
    .q-bubble text { fill:#26215C; }
  </style>

  <!-- ══════════════════════════════════════════
       BACKGROUND — subtle section bands
  ══════════════════════════════════════════════ -->
  <rect x="0" y="60"  width="680" height="100" rx="0" fill="#E1F5EE" opacity=".18"/>
  <rect x="0" y="220" width="680" height="100" rx="0" fill="#EEEDFE" opacity=".18"/>
  <rect x="0" y="380" width="680" height="100" rx="0" fill="#FAEEDA" opacity=".18"/>
  <rect x="0" y="530" width="680" height="100" rx="0" fill="#FAECE7" opacity=".18"/>
  <rect x="0" y="680" width="680" height="220" rx="0" fill="#E6F1FB" opacity=".18"/>

  <!-- ══════════════════════════════════════════
       TITLE
  ══════════════════════════════════════════════ -->
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#2C2C2A">Video Course RAG Assistant — Pipeline</text>
  <line x1="40" y1="40" x2="640" y2="40" class="div"/>

  <!-- ══════════════════════════════════════════
       INPUT
  ══════════════════════════════════════════════ -->
  <text x="44" y="58" class="lbl">INPUT</text>
  <g class="folder">
    <rect x="220" y="66" width="240" height="54" rx="8"/>
    <text x="340" y="88"  text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">videos/</text>
    <text x="340" y="106" text-anchor="middle" font-size="11" fill="#5F5E5A">Raw .mp4 lecture downloads</text>
  </g>

  <!-- ══════════════════════════════════════════
       AUDIO EXTRACTION
  ══════════════════════════════════════════════ -->
  <line x1="340" y1="120" x2="340" y2="148" class="conn-teal" marker-end="url(#arr-teal)"/>
  <text x="44" y="165" class="lbl">AUDIO EXTRACTION</text>
  <g class="teal">
    <rect x="196" y="170" width="288" height="54" rx="8"/>
    <text x="340" y="192" text-anchor="middle" font-size="13" class="head">videos_to_mp3.py</text>
    <text x="340" y="210" text-anchor="middle" font-size="11" class="sub">FFmpeg: .mp4 → .mp3</text>
  </g>
  <!-- FFmpeg badge -->
  <rect x="502" y="183" width="66" height="22" rx="11" class="teal-pill"/>
  <text x="535" y="198" text-anchor="middle" font-size="10" font-weight="600" class="teal-pill-t">FFmpeg</text>

  <line x1="340" y1="224" x2="340" y2="254" class="conn-teal" marker-end="url(#arr-teal)"/>
  <g class="folder">
    <rect x="220" y="260" width="240" height="54" rx="8"/>
    <text x="340" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">audios/</text>
    <text x="340" y="300" text-anchor="middle" font-size="11" fill="#5F5E5A">.mp3 audio files</text>
  </g>

  <!-- ══════════════════════════════════════════
       TRANSCRIPTION
  ══════════════════════════════════════════════ -->
  <line x1="340" y1="314" x2="340" y2="342" class="conn-purple" marker-end="url(#arr-purple)"/>
  <text x="44" y="360" class="lbl">TRANSCRIPTION</text>
  <g class="purple">
    <rect x="196" y="366" width="288" height="54" rx="8"/>
    <text x="340" y="388" text-anchor="middle" font-size="13" class="head">mp3_to_jsons.py</text>
    <text x="340" y="406" text-anchor="middle" font-size="11" class="sub">Whisper medium → timestamped JSON</text>
  </g>
  <!-- Whisper badge -->
  <rect x="498" y="379" width="82" height="22" rx="11" class="purple-pill"/>
  <text x="539" y="394" text-anchor="middle" font-size="10" font-weight="600" class="purple-pill-t">Whisper</text>

  <line x1="340" y1="420" x2="340" y2="450" class="conn-purple" marker-end="url(#arr-purple)"/>
  <g class="folder">
    <rect x="220" y="456" width="240" height="54" rx="8"/>
    <text x="340" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">jsons/</text>
    <text x="340" y="496" text-anchor="middle" font-size="11" fill="#5F5E5A">Timestamped transcript chunks</text>
  </g>

  <!-- ══════════════════════════════════════════
       CHUNKING
  ══════════════════════════════════════════════ -->
  <line x1="340" y1="510" x2="340" y2="538" class="conn-amber" marker-end="url(#arr-amber)"/>
  <text x="44" y="556" class="lbl">CHUNKING</text>
  <g class="amber">
    <rect x="196" y="562" width="288" height="54" rx="8"/>
    <text x="340" y="584" text-anchor="middle" font-size="13" class="head">merge_chunks.py</text>
    <text x="340" y="602" text-anchor="middle" font-size="11" class="sub">Sliding-window semantic merging</text>
  </g>

  <line x1="340" y1="616" x2="340" y2="646" class="conn-amber" marker-end="url(#arr-amber)"/>
  <g class="folder">
    <rect x="196" y="652" width="288" height="54" rx="8"/>
    <text x="340" y="674" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">merged_jsons/</text>
    <text x="340" y="692" text-anchor="middle" font-size="11" fill="#5F5E5A">Retrieval-optimised chunks</text>
  </g>

  <!-- ══════════════════════════════════════════
       EMBEDDINGS
  ══════════════════════════════════════════════ -->
  <line x1="340" y1="706" x2="340" y2="734" class="conn-coral" marker-end="url(#arr-coral)"/>
  <text x="44" y="752" class="lbl">EMBEDDINGS</text>
  <g class="coral">
    <rect x="196" y="758" width="288" height="54" rx="8"/>
    <text x="340" y="780" text-anchor="middle" font-size="13" class="head">preprocessed_json.py</text>
    <text x="340" y="798" text-anchor="middle" font-size="11" class="sub">Ollama bge-m3 → joblib store</text>
  </g>
  <!-- Ollama badge -->
  <rect x="100" y="771" width="52" height="22" rx="11" class="coral-pill"/>
  <text x="126" y="786" text-anchor="middle" font-size="10" font-weight="600" class="coral-pill-t">Ollama</text>
  <!-- bge-m3 badge -->
  <rect x="44"  y="771" width="50" height="22" rx="11" class="coral-pill"/>
  <text x="69"  y="786" text-anchor="middle" font-size="10" font-weight="600" class="coral-pill-t">bge-m3</text>

  <line x1="340" y1="812" x2="340" y2="842" class="conn-coral" marker-end="url(#arr-coral)"/>
  <g class="folder">
    <rect x="196" y="848" width="288" height="54" rx="8"/>
    <text x="340" y="870" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">chunks_embeddings.joblib</text>
    <text x="340" y="888" text-anchor="middle" font-size="11" fill="#5F5E5A">Chunk text + metadata + vectors</text>
  </g>

  <!-- ══════════════════════════════════════════
       RETRIEVAL + GENERATION
  ══════════════════════════════════════════════ -->
  <line x1="340" y1="902" x2="340" y2="930" class="conn-blue" marker-end="url(#arr-blue)"/>
  <text x="44" y="947" class="lbl">RETRIEVAL + GENERATION</text>

  <!-- Query enters from the left -->
  <g class="q-bubble">
    <rect x="44" y="952" width="130" height="44" rx="8"/>
    <text x="109" y="969" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">User question</text>
    <text x="109" y="985" text-anchor="middle" font-size="10" fill="#534AB7">cosine similarity search</text>
  </g>
  <line x1="174" y1="974" x2="196" y2="974" class="conn-blue" marker-end="url(#arr-blue)"/>

  <g class="blue">
    <rect x="196" y="952" width="288" height="54" rx="8"/>
    <text x="340" y="974" text-anchor="middle" font-size="13" class="head">process_incoming.py</text>
    <text x="340" y="992" text-anchor="middle" font-size="11" class="sub">Retrieve chunks → build prompt → Groq</text>
  </g>
  <!-- Groq badge -->
  <rect x="498" y="965" width="46" height="22" rx="11" class="blue-pill"/>
  <text x="521" y="980" text-anchor="middle" font-size="10" font-weight="600" class="blue-pill-t">Groq</text>

  <line x1="340" y1="1006" x2="340" y2="1034" class="conn-blue" marker-end="url(#arr-blue)"/>

  <!-- OUTPUT node -->
  <rect x="196" y="1040" width="288" height="24" rx="6" fill="#C0DD97" stroke="#3B6D11" stroke-width=".5"/>
  <text x="340" y="1056" text-anchor="middle" font-size="11" font-weight="700" fill="#173404">Answer + best video timestamp</text>

</svg>
